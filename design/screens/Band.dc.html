<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Peri · Vexo band</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
@keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.6);opacity:0}}
.pulse{animation:pulse 2.4s ease-out infinite}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #FFFFFF; overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111111">

<div style="position: absolute; top: 60px; left: 20px; right: 20px">
<div style="font-size: 36px; font-weight: 800; letter-spacing: -1.2px">Your band</div>
<div style="font-size: 14px; font-weight: 500; color: #6B6B76; margin-top: 4px">Vexo · connected · 82% battery</div>
</div>

<div style="position: absolute; top: 150px; left: 16px; right: 16px; height: 200px; border-radius: 28px; background: #F3F3F5; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ on }}" hint-placeholder-val="{{ true }}">
<span class="pulse" style="position: absolute; width: 150px; height: 150px; border-radius: 75px; background: #CDEBD6"></span>
</sc-if>
<span style="position: relative; width: 170px; height: 64px; border-radius: 32px; background: #111111; display: flex; align-items: center; justify-content: center; gap: 4px">
<span style="{{ dot }}"></span><span style="width: 3px; height: 14px; border-radius: 2px; background: #FFFFFF; opacity: 0.6"></span><span style="width: 3px; height: 22px; border-radius: 2px; background: #FFFFFF; opacity: 0.6"></span><span style="width: 3px; height: 10px; border-radius: 2px; background: #FFFFFF; opacity: 0.6"></span>
</span>
</div>

<div style="position: absolute; top: 366px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; height: 72px; padding: 0 16px; border-radius: 22px; border: 2px solid #F0F0F3">
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">Listening for promises</span><span style="display: block; font-size: 12px; font-weight: 500; color: #6B6B76; margin-top: 2px">{{ status }}</span></span>
<button onClick="{{ toggle }}" aria-pressed="{{ pressed }}" aria-label="Listening for promises" style="{{ track }}"><span style="{{ knob }}"></span></button>
</div>

<div style="position: absolute; top: 452px; left: 16px; right: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="height: 70px; border-radius: 20px; background: #FFF1E8; display: flex; flex-direction: column; align-items: center; justify-content: center"><b style="font-size: 20px; font-weight: 800">4</b><span style="font-size: 12px; font-weight: 600; color: #6B4A3A">promises heard today</span></div>
<div style="height: 70px; border-radius: 20px; background: #CDEBFB; display: flex; flex-direction: column; align-items: center; justify-content: center"><b style="font-size: 20px; font-weight: 800">12</b><span style="font-size: 12px; font-weight: 600; color: #2E4A5E">conversations</span></div>
</div>

<div style="position: absolute; top: 538px; left: 16px; right: 16px; border: 2px solid #F0F0F3; border-radius: 22px; padding: 4px 16px">
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 2px solid #F0F0F3"><span style="width: 10px; height: 10px; border-radius: 5px; background: #7CC99A"></span><span style="flex: 1; font-size: 13px; font-weight: 600">Audio is never stored, only promises</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 2px solid #F0F0F3"><span style="width: 10px; height: 10px; border-radius: 5px; background: #7CC99A"></span><span style="flex: 1; font-size: 13px; font-weight: 600">Others' words are summarized, never quoted</span></div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 52px"><span style="width: 10px; height: 10px; border-radius: 5px; background: #7CC99A"></span><span style="flex: 1; font-size: 13px; font-weight: 600">Money never moves without your approval</span></div>
</div>

<div style="position: absolute; top: 718px; left: 20px; right: 20px; display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; color: #6B6B76">
<span>1 buzz · promise saved</span><span>2 buzzes · due soon</span>
</div>

<div style="position: absolute; left: 32px; right: 32px; bottom: 28px; height: 68px; border-radius: 34px; background: #111111; box-shadow: 0 10px 28px rgba(17,17,17,0.3); display: flex; align-items: center; justify-content: space-around; padding: 0 6px">
<a href="Main.dc.html" aria-label="Universe" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9AA5" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><ellipse cx="12" cy="12" rx="10" ry="4.5" transform="rotate(-25 12 12)"/></svg></a>
<a href="People.dc.html" aria-label="People" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9AA5" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg></a>
<a href="Mic.dc.html" aria-label="Hold to tell Peri a promise" style="width: 58px; height: 58px; border-radius: 29px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 5px rgba(255,255,255,0.14)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></a>
<a href="Rhythm.dc.html" aria-label="Ask Peri" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#9A9AA5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M9 10.5h.01M12 10.5h.01M15 10.5h.01"/></svg></a>
<a href="Band.dc.html" aria-label="Vexo band" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="9" width="16" height="6" rx="3"/><path d="M8 9V5h8v4M8 15v4h8v-4"/></svg></a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const on = !(this.state && this.state.off);
return {
on: on,
pressed: on ? 'true' : 'false',
status: on ? 'On · only listens for commitments' : 'Paused · nothing is being heard',
dot: 'width: 10px; height: 10px; border-radius: 5px; margin-right: 8px; background: ' + (on ? '#7CC99A' : '#6B6B76'),
track: 'position: relative; width: 56px; height: 34px; border-radius: 17px; border: none; cursor: pointer; padding: 0; flex-shrink: 0; background: ' + (on ? '#111111' : '#DADAE0'),
knob: 'position: absolute; top: 4px; left: ' + (on ? '26px' : '4px') + '; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; transition: left 200ms ease',
toggle: () => this.setState({ off: on })
};
}
}
</script>
</body>
</html>
