<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mendly · Promise heard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; background: #F3F3F5; overflow: hidden; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #111111">

<div style="position: absolute; left: 21px; top: 70px; width: 344px; height: 344px; border-radius: 172px; border: 1.5px dashed #D4D4DC"></div>
<div style="position: absolute; left: 71px; top: 120px; width: 244px; height: 244px; border-radius: 122px; border: 1.5px solid #E1E1E7"></div>
<div style="position: absolute; left: 161px; top: 210px; width: 64px; height: 64px; border-radius: 32px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800">You</div>
<div style="position: absolute; left: 167px; top: 104px; width: 52px; height: 52px; border-radius: 26px; background: #FFE3B8; border: 3px solid #FFFFFF; box-shadow: 0 0 0 2.5px #F26A3D, 0 0 0 10px rgba(242,106,61,0.15); box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 19px; font-weight: 800">D</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: #FFFFFF; border-radius: 32px 32px 0 0; box-shadow: 0 -10px 30px rgba(17,17,17,0.08); padding: 12px 20px 0; box-sizing: border-box">
<div style="width: 40px; height: 5px; border-radius: 3px; background: #DADAE0; margin: 0 auto 16px"></div>
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 22px; font-weight: 800; letter-spacing: -0.5px">Promise heard</span>
<span style="height: 28px; padding: 0 10px; border-radius: 14px; background: #CDEBD6; display: flex; align-items: center; font-size: 12px; font-weight: 800">92% sure</span>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 12px 14px; border-radius: 18px; background: #FFF1E8">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M3 12h2M7 8v8M11 4v16M15 8v8M19 10v4"/></svg>
<span style="flex: 1; font-size: 15px; font-weight: 700">"I'll send you $120 tonight"</span>
<span style="font-size: 12px; font-weight: 600; color: #6B6B76">9:41 AM</span>
</div>

<div style="font-size: 13px; font-weight: 700; color: #6B6B76; margin-top: 16px">What kind of promise?</div>
<div role="group" aria-label="Promise type" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 8px">
<sc-for list="{{ kinds }}" as="k" hint-placeholder-count="4">
<button onClick="{{ k.pick }}" aria-pressed="{{ k.pressed }}" style="{{ k.style }}">{{ k.label }}</button>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 12px; margin-top: 16px">
<span style="width: 44px; height: 44px; border-radius: 22px; background: #FFE3B8; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800">D</span>
<span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">To Diego R.</span><span style="display: block; font-size: 12px; font-weight: 500; color: #6B6B76">Friend · for Friday's concert tickets</span></span>
<span style="font-size: 30px; font-weight: 800; letter-spacing: -1px">$120</span>
</div>
<div style="display: flex; gap: 8px; margin-top: 12px">
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: #F3F3F5; display: flex; align-items: center; font-size: 12px; font-weight: 700">Due tonight · 8 PM</span>
<span style="height: 34px; padding: 0 12px; border-radius: 17px; background: #F3F3F5; display: flex; align-items: center; font-size: 12px; font-weight: 700">Remind on band</span>
</div>

<a href="Transfer.dc.html" style="margin-top: 20px; height: 56px; border-radius: 28px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">Save &amp; set up transfer</a>
<a href="Main.dc.html" style="margin-top: 8px; height: 48px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #6B6B76">That wasn't a promise</a>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.kind) || 'Money';
const tone = { Money: '#FFD9C9', Gift: '#F9C9C4', Task: '#CDEBFB', Plan: '#FFF0B8' };
const kinds = ['Money', 'Gift', 'Task', 'Plan'].map((k) => ({
label: k,
pressed: k === picked ? 'true' : 'false',
pick: () => this.setState({ kind: k }),
style: 'height: 48px; border-radius: 16px; font-family: inherit; font-size: 13px; font-weight: 800; cursor: pointer; color: #111111; border: 2px solid ' + (k === picked ? '#111111' : 'transparent') + '; background: ' + tone[k]
}));
return { kinds: kinds };
}
}
</script>
</body>
</html>
